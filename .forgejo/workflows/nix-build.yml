name: Build all systems
enable-email-notifications: true
on:
  push:
    paths:
      - "**/*.nix"
      - "**/flake.lock"
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GH_TOKEN }}" > ~/.config/nix/nix.conf
      - name: Build all systems
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          configs=$(nix --extra-experimental-features "nix-command flakes" eval --json .#nixosConfigurations --apply 'builtins.attrNames' --accept-flake-config)
          for config in $(echo "$configs" | nix run nixpkgs#jq -- -r '.[]'); do
            nix run github:Mic92/nix-fast-build -- \
              --flake ".#nixosConfigurations.${config}.config.system.build.toplevel" \
              --option accept-flake-config true \
              --no-nom \
              --skip-cached
          done
      - name: Merge staging to main
        if: forgejo.ref == 'refs/heads/staging'
        run: |
          git config user.name "Flake Updater"
          git config user.email "flake-updater@forge.onyx.ovh"
          git switch main
          git merge origin/staging --no-ff -m "Merge staging into main"
          git push origin main
