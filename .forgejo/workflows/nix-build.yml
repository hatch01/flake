name: Build all systems
enable-email-notifications: true
on:
  push:
    paths:
      - "**/*.nix"
      - "**/flake.lock"
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GH_TOKEN }}" > ~/.config/nix/nix.conf
      - name: Build all systems
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          nix run github:Mic92/nix-fast-build -- \
            --flake .#nixosConfigurations \
            --accept-flake-config \
            -L \
            --no-nom \
            --skip-cached
      - name: Merge staging to main
        if: forgejo.ref == 'refs/heads/staging'
        run: |
          git config user.name "Flake Updater"
          git config user.email "flake-updater@forge.onyx.ovh"
          git switch main
          git merge origin/staging --no-ff -m "Merge staging into main"
          git push origin main
